name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:slack
      - run: npm run test:security
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:viewer
      - run: node scripts/build-desk.mjs
      - run: npm run test:desk
      - run: git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: viewer-test-evidence
          path: |
            test-results/
            test-results-desk/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/prepare-studio-archive.py
      - run: docker build --target smoke -t rhwp-slack:smoke .
      - name: Test server PDF with production memory limit
        run: >-
          docker run --rm --init --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
          --shm-size=256m --memory=4g --cpus=2 --pids-limit=256
          --cap-drop=ALL --security-opt=no-new-privileges
          rhwp-slack:smoke node scripts/container-smoke.mjs --server-only
      - name: Prepare synthetic evidence directory
        run: install -d -m 0777 container-evidence
      - name: Test isolated runtime with synthetic Slack
        run: >-
          docker run --rm --init --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
          --shm-size=256m --memory=4g --cpus=2 --pids-limit=256
          --cap-drop=ALL --security-opt=no-new-privileges
          --mount type=bind,source=${{ github.workspace }}/container-evidence,target=/evidence
          --env RHWP_SMOKE_EVIDENCE=/evidence
          rhwp-slack:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-synthetic-evidence
          path: container-evidence/
          retention-days: 7
      - run: docker build --target release -t rhwp-slack:release .
