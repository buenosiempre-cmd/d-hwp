<!doctype html>
<html lang="ko">
<head><meta name="rhwp-api-origin" content=""><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문서 편집 · D-HWP</title></head>
<body data-state="loading">
  <main id="editor" aria-label="문서 편집기"></main>
  <section id="notice" aria-label="문서 상태">
    <p id="status" role="status">편집기 준비 중</p>
    <p id="reopen" hidden>이 창을 닫고 Slack 원본 메시지의 스레드에서 <strong>rhwp에서 편집</strong> 문서 카드를 다시 클릭해 주세요.</p>
    <div id="local" hidden>
      <label>테스트 문서 열기 <input id="file" type="file" accept=".hwp,.hwpx"></label>
      <p>개발용 문서는 Slack에 저장되지 않습니다.</p>
    </div>
  </section>
  <button id="dhwp-toggle" type="button" aria-expanded="false" aria-controls="dhwp-assistant" hidden>D-HWP · AI 업무 도우미</button>
  <aside id="dhwp-assistant" aria-label="D-HWP AI 업무 도우미" hidden>
    <div class="dhwp-assistant-heading"><strong>D-HWP · 동국 한글문서 도우미</strong><button id="dhwp-close" type="button" aria-label="업무 도우미 닫기">닫기</button></div>
    <div id="dhwp-assistant-body"></div>
  </aside>
  <script type="module" src="/main.ts"></script>
</body>
</html>
